name: Feature proposal
description: Propose a scoped Linux capability or compatibility change
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the need without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Linux scope and compatibility
      description: Identify GTK, portal, provider, Core, localization, and release-contract impact.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and data flow
      description: Describe new inputs, outputs, storage, providers, permissions, or trust boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: State the observable scenario and validation needed.
    validations:
      required: true
